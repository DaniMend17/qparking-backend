name: CI - Spring Modulith Architecture Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  spring-modulith-architecture-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Execute spring modulith architecture tests
      run: mvn test -Dtest=ModularityTest
